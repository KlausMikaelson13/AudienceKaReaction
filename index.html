<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to My Theatre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 40px;
      color: red;
      text-shadow: 0 0 20px red;
      margin-bottom: 20px;
    }

    .doors {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
    }

    .door {
      width: 50%;
      height: 100%;
      background: linear-gradient(to bottom, #300, #700);
      border: 2px solid #111;
      transition: 1s;
    }

    .left {
      transform-origin: left;
    }

    .right {
      transform-origin: right;
    }

    .open .left {
      transform: rotateY(-90deg);
    }

    .open .right {
      transform: rotateY(90deg);
    }

    button {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 18px;
      background: red;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }

    .glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: 1s;
    }

    .open .glow {
      opacity: 1;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🎬 DIGITAL CINEMA</h1>

  <div class="doors" id="doors">
    <div class="door left"></div>
    <div class="door right"></div>
    <div class="glow"></div>
  </div>

  <button onclick="enterTheatre()">🎟️ Enter Theatre</button>

</div>

<script>
function enterTheatre() {
  const doors = document.getElementById("doors");
  doors.classList.add("open");

  setTimeout(() => {
    window.location.href = "theatre.html"; // next page
  }, 1200);
}
</script>

</body>
</html>
