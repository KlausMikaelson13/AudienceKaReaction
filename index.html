<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinema Entrance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #1a1a1a;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Main Building */
.cinema {
  width: 700px;
  background: #2c2c2c;
  border: 5px solid #111;
  box-shadow: 0 0 40px rgba(255,0,0,0.3);
}

/* Marquee Board */
.marquee {
  background: #eee;
  padding: 15px;
  text-align: center;
  border-bottom: 5px solid #111;
}

.marquee h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 4px;
}

.marquee p {
  margin: 5px 0;
  font-size: 12px;
}

/* Lights */
.lights {
  display: flex;
  justify-content: center;
  gap: 8px;
  background: #000;
  padding: 10px;
}

.light {
  width: 10px;
  height: 10px;
  background: yellow;
  border-radius: 50%;
  animation: blink 1s infinite alternate;
}

.light:nth-child(odd) {
  animation-delay: 0.5s;
}

@keyframes blink {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* Entrance Section */
.entrance {
  display: flex;
  justify-content: space-between;
  padding: 20px;
}

/* Ticket Booth */
.ticket {
  width: 120px;
  height: 120px;
  background: #444;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #222;
}

/* Posters */
.posters {
  width: 120px;
  height: 120px;
  background: #333;
  border: 2px solid #222;
  display: flex;
  flex-wrap: wrap;
}

.poster {
  width: 50%;
  height: 50%;
  background: #555;
}

/* Curtains */
.curtain-container {
  position: relative;
  width: 200px;
  height: 150px;
  background: black;
  overflow: hidden;
}

.curtain {
  position: absolute;
  width: 50%;
  height: 100%;
  background: crimson;
  transition: 1s;
}

.left {
  left: 0;
}

.right {
  right: 0;
}

.open .left {
  transform: translateX(-100%);
}

.open .right {
  transform: translateX(100%);
}

/* Enter Button */
.enter-btn {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 15px;
  background: red;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

.enter-btn:hover {
  background: darkred;
}

</style>
</head>

<body>

<div class="cinema">

  <!-- Marquee -->
  <div class="marquee">
    <h1>VALENTINO CINEMA</h1>
    <p>FILM IS ABOUT TO START • SEE YOU AT THE MOVIES</p>
  </div>

  <!-- Lights -->
  <div class="lights">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
  </div>

  <!-- Entrance -->
  <div class="entrance">

    <div class="ticket">🎟️ TICKETS</div>

    <div class="curtain-container" id="curtainBox">
      <div class="curtain left"></div>
      <div class="curtain right"></div>
      <button class="enter-btn" onclick="enter()">ENTER</button>
    </div>

    <div class="posters">
      <div class="poster"></div>
      <div class="poster"></div>
      <div class="poster"></div>
      <div class="poster"></div>
    </div>

  </div>

</div>

<script>
function enter() {
  const curtain = document.getElementById("curtainBox");
  curtain.classList.add("open");

  setTimeout(() => {
    window.location.href = "theatre.html";
  }, 1200);
}
</script>

</body>
</html>
