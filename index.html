<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Cinema Entrance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #111, #000);
  font-family: 'Arial', sans-serif;
  color: white;
  overflow: hidden;
}

/* FULL CONTAINER */
.wrapper {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* CINEMA BUILDING */
.cinema {
  width: 90%;
  max-width: 1000px;
  background: #2b2b2b;
  border-radius: 10px;
  box-shadow: 0 0 60px rgba(255,0,0,0.4);
  overflow: hidden;
  transform: scale(1);
  transition: transform 1.2s ease;
}

/* ZOOM EFFECT */
.zoom {
  transform: scale(1.5);
}

/* MARQUEE */
.marquee {
  background: #f5f5f5;
  color: black;
  text-align: center;
  padding: 20px;
  position: relative;
}

.marquee h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: 6px;
}

.marquee p {
  margin-top: 10px;
  font-size: 14px;
}

/* RUNNING LIGHTS */
.lights {
  display: flex;
  justify-content: center;
  gap: 10px;
  background: black;
  padding: 12px;
}

.light {
  width: 12px;
  height: 12px;
  background: gold;
  border-radius: 50%;
  animation: glow 1s infinite alternate;
}

.light:nth-child(odd) {
  animation-delay: 0.5s;
}

@keyframes glow {
  from { opacity: 0.3; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1.2); }
}

/* MAIN ENTRANCE AREA */
.entrance {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 40px;
}

/* TICKET BOOTH */
.ticket {
  width: 150px;
  height: 150px;
  background: linear-gradient(#444, #222);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: inset 0 0 10px black;
}

/* POSTERS */
.posters {
  width: 150px;
  height: 150px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}

.poster {
  background: #555;
  border-radius: 5px;
  transition: 0.3s;
}

.poster:hover {
  transform: scale(1.1);
  background: crimson;
}

/* CURTAIN AREA */
.curtain-box {
  position: relative;
  width: 300px;
  height: 200px;
  background: black;
  overflow: hidden;
  border-radius: 8px;
}

/* CURTAINS */
.curtain {
  position: absolute;
  width: 50%;
  height: 100%;
  background: linear-gradient(crimson, darkred);
  transition: 1.2s ease;
}

.left { left: 0; }
.right { right: 0; }

.open .left { transform: translateX(-100%); }
.open .right { transform: translateX(100%); }

/* ENTER BUTTON */
.enter-btn {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 16px;
  background: red;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,0,0,0.6);
}

.enter-btn:hover {
  background: darkred;
}

/* FOOTER TEXT */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.7;
}

</style>
</head>

<body>

<div class="wrapper">

  <div class="cinema" id="cinema">

    <!-- MARQUEE -->
    <div class="marquee">
      <h1>VALENTINO CINEMA</h1>
      <p>FILM IS ABOUT TO START • SEE YOU AT THE MOVIES</p>
    </div>

    <!-- LIGHTS -->
    <div class="lights">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>

    <!-- ENTRANCE -->
    <div class="entrance">

      <div class="ticket">🎟️ TICKETS</div>

      <div class="curtain-box" id="curtainBox">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
        <button class="enter-btn" onclick="enterTheatre()">ENTER</button>
      </div>

      <div class="posters">
        <div class="poster"></div>
        <div class="poster"></div>
        <div class="poster"></div>
        <div class="poster"></div>
      </div>

    </div>

  </div>

  <div class="footer">🍿 Experience the Cinema Like Never Before</div>

</div>

<script>
function enterTheatre() {
  const curtain = document.getElementById("curtainBox");
  const cinema = document.getElementById("cinema");

  curtain.classList.add("open");
  cinema.classList.add("zoom");

  setTimeout(() => {
    window.location.href = "theatre.html";
  }, 1500);
}
</script>

</body>
</html>
