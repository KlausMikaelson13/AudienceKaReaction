<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Theatre Simulator</title>
<style>
  body { margin: 0; overflow: hidden; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/PointerLockControls.js"></script>

<script>
let camera, scene, renderer, controls;
let objects = [];
let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;
let velocity = new THREE.Vector3();

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000);

  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.PointerLockControls(camera, document.body);

  document.addEventListener("click", () => {
    controls.lock();
  });

  scene.add(controls.getObject());

  // LIGHT
  const light = new THREE.HemisphereLight(0xffffff, 0x444444);
  scene.add(light);

  // FLOOR
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // WALLS
  const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });

  function createWall(x, z, w, h, d) {
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      wallMaterial
    );
    wall.position.set(x, h/2, z);
    scene.add(wall);
    objects.push(wall);
  }

  // Room boundaries
  createWall(0, -20, 40, 10, 1);
  createWall(0, 20, 40, 10, 1);
  createWall(-20, 0, 1, 10, 40);
  createWall(20, 0, 1, 10, 40);

  // Seats (collision objects)
  const seatMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });

  for (let i = -10; i <= 10; i += 2) {
    for (let j = -5; j <= 5; j += 2) {
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        seatMat
      );
      seat.position.set(i, 0.5, j);
      scene.add(seat);
      objects.push(seat);
    }
  }

  // SCREEN
  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(10, 5, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  screen.position.set(0, 4, -18);
  scene.add(screen);

  // CONTROLS
  document.addEventListener("keydown", (e) => {
    if (e.code === "KeyW") moveForward = true;
    if (e.code === "KeyS") moveBackward = true;
    if (e.code === "KeyA") moveLeft = true;
    if (e.code === "KeyD") moveRight = true;
  });

  document.addEventListener("keyup", (e) => {
    if (e.code === "KeyW") moveForward = false;
    if (e.code === "KeyS") moveBackward = false;
    if (e.code === "KeyA") moveLeft = false;
    if (e.code === "KeyD") moveRight = false;
  });
}

function animate() {
  requestAnimationFrame(animate);

  velocity.set(0,0,0);

  if (moveForward) velocity.z -= 0.2;
  if (moveBackward) velocity.z += 0.2;
  if (moveLeft) velocity.x -= 0.2;
  if (moveRight) velocity.x += 0.2;

  // Collision check
  let nextPosition = controls.getObject().position.clone().add(velocity);

  for (let obj of objects) {
    let distance = nextPosition.distanceTo(obj.position);
    if (distance < 1.5) return; // stop movement
  }

  controls.moveRight(velocity.x);
  controls.moveForward(velocity.z);

  renderer.render(scene, camera);
}

</script>

</body>
</html>
