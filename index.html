<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CinemaVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero {
  height: 100vh;
  background: radial-gradient(circle at center, #111, #000 70%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

/* FILM GRAIN EFFECT */
.hero::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("https://www.transparenttextures.com/patterns/asfalt-light.png");
  opacity: 0.2;
}

/* TITLE */
.title {
  font-size: 60px;
  letter-spacing: 8px;
  color: red;
  text-shadow: 0 0 25px red;
  z-index: 1;
}

/* TAGLINE */
.tagline {
  margin-top: 20px;
  font-size: 18px;
  opacity: 0.8;
  z-index: 1;
}

/* CTA BUTTON */
.enter-btn {
  margin-top: 40px;
  padding: 15px 30px;
  font-size: 18px;
  background: red;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,0,0,0.6);
  z-index: 1;
  transition: 0.3s;
}

.enter-btn:hover {
  background: darkred;
  transform: scale(1.05);
}

/* SCROLL SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
}

.section h2 {
  font-size: 32px;
  margin-bottom: 30px;
}

/* CARDS */
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  width: 250px;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,0,0,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

/* CARD IMAGE */
.card-img {
  height: 150px;
  background: linear-gradient(45deg, #333, #555);
}

/* CARD CONTENT */
.card-content {
  padding: 15px;
}

.card-title {
  font-size: 18px;
  margin-bottom: 10px;
}

.card-desc {
  font-size: 13px;
  opacity: 0.7;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  background: #111;
  margin-top: 40px;
  font-size: 14px;
  opacity: 0.6;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="title">CINEMAVERSE</div>
  <div class="tagline">Where Movies, Moments & Madness Come Alive 🎬</div>
  <button class="enter-btn" onclick="enter()">🎟️ Enter Theatre</button>
</div>

<!-- SECTIONS -->
<div class="section">
  <h2>🔥 What’s Playing</h2>

  <div class="cards">

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🎬 Movie Reactions</div>
        <div class="card-desc">Feel the crowd energy</div>
      </div>
    </div>

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🏏 Cricket Screenings</div>
        <div class="card-desc">Stadium vibes at home</div>
      </div>
    </div>

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🔥 WWE Nights</div>
        <div class="card-desc">Experience the chaos live</div>
      </div>
    </div>

  </div>
</div>

<div class="footer">
  🍿 Built for Cinema Lovers | Experience > Watching
</div>

<script>
function enter() {
  window.location.href = "entrance.html"; // your entrance page
}
</script>

</body>
</html>
