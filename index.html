<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CinemaVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #fff8f0, #ffe4d6);
  color: #222;
}

/* HERO */
.hero {
  height: 100vh;
  background: radial-gradient(circle at center, #fff, #ffe4d6);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  text-align: center;
  overflow: hidden;
}

/* PROJECTOR */
.projector {
  position: absolute;
  top: 20%;
  left: 10%;
  width: 200px;
  height: 120px;
  z-index: 0;
}

.reel {
  width: 60px;
  height: 60px;
  border: 5px solid #555;
  border-radius: 50%;
  position: absolute;
  animation: spin 3s linear infinite;
}

.reel-left { top: 0; left: 0; }
.reel-right { top: 0; left: 80px; }

.reel::before {
  content: "";
  position: absolute;
  width: 15px;
  height: 15px;
  background: #555;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* LIGHT BEAM */
.beam {
  position: absolute;
  top: 30px;
  left: 140px;
  width: 700px;
  height: 120px;
  background: linear-gradient(to right, rgba(255,255,200,0.5), transparent);
  transform: skewY(-10deg);
  filter: blur(10px);
  opacity: 0.6;
}

/* TITLE */
.title {
  font-size: 60px;
  letter-spacing: 6px;
  color: #d62828;
  text-shadow: 0 0 10px rgba(255,0,0,0.4);
  z-index: 2;
}

/* TAGLINE */
.tagline {
  margin-top: 15px;
  font-size: 18px;
  color: #444;
  z-index: 2;
}

/* BUTTON */
.enter-btn {
  margin-top: 30px;
  padding: 14px 28px;
  font-size: 18px;
  background: #d62828;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(214,40,40,0.4);
  z-index: 2;
  transition: 0.3s;
}

.enter-btn:hover {
  background: #a61c1c;
  transform: scale(1.05);
}

/* SECTION */
.section {
  padding: 60px 20px;
  text-align: center;
}

.section h2 {
  font-size: 32px;
  margin-bottom: 30px;
  color: #d62828;
}

/* CARDS */
.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  width: 250px;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}

.card-img {
  height: 150px;
  background: linear-gradient(45deg, #ddd, #bbb);
}

.card-content {
  padding: 15px;
}

.card-title {
  font-size: 18px;
  margin-bottom: 8px;
  color: #222;
}

.card-desc {
  font-size: 13px;
  color: #666;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  background: #fff0e6;
  font-size: 14px;
  color: #666;
}
</style>
</head>

<body>

<div class="hero">

  <!-- PROJECTOR -->
  <div class="projector">
    <div class="reel reel-left"></div>
    <div class="reel reel-right"></div>
    <div class="beam"></div>
  </div>

  <div class="title">CINEMAVERSE</div>
  <div class="tagline">Step Into The Spotlight 🎬</div>
  <button class="enter-btn" onclick="enter()">🎟️ Enter Theatre</button>

</div>

<div class="section">
  <h2>🔥 What’s Playing</h2>

  <div class="cards">

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🎬 Movie Reactions</div>
        <div class="card-desc">Feel the crowd energy</div>
      </div>
    </div>

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🏏 Cricket Screening</div>
        <div class="card-desc">Stadium vibes at home</div>
      </div>
    </div>

    <div class="card">
      <div class="card-img"></div>
      <div class="card-content">
        <div class="card-title">🔥 WWE Events</div>
        <div class="card-desc">Feel the live action</div>
      </div>
    </div>

  </div>
</div>

<div class="footer">
  🍿 A Place Where Cinema Feels Alive
</div>

<script>
function enter() {
  window.location.href = "entrance.html";
}
</script>

</body>
</html>
